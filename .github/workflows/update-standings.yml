name: Update GPL Standings Table

on:
  schedule:
    # Runs Sunday and Monday at 21:00 UTC (after GPL weekend matchdays)
    - cron: '0 21 * * 0,1'
  workflow_dispatch: # Allows 1-click manual trigger from GitHub Actions tab

jobs:
  update-standings:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch and Sync Standings
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: node scripts/sync-table.js

      - name: Commit and Push Updated Standings
        run: |
          git config --global user.name "YAFC Standings Bot"
          git config --global user.email "bot@youngapostlesfc.com"
          git add data/cms.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(standings): auto-update live GPL table" && git push)
