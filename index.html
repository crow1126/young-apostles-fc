<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Young Apostles FC | Official Website</title>

  <!-- Security Meta Headers -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()">
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline';
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com;
    img-src 'self' data: blob:;
    connect-src 'self';
    frame-ancestors 'none';
    base-uri 'self';
    form-action 'self'
  ">

  <link rel="icon" type="image/png" href="assets/official-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #050B1E;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Outfit', sans-serif;
    }

    /* ── Particle canvas sits behind everything ── */
    #splash-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* ── Main splash wrapper ── */
    #splash {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      z-index: 10;
      opacity: 0;
      animation: splashEnter 0.6s ease forwards 0.1s;
    }

    @keyframes splashEnter {
      to { opacity: 1; }
    }

    /* ── Logo container – the heartbeat lives here ── */
    .logo-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 180px;
      height: 180px;
    }

    /* Ripple rings */
    .ring {
      position: absolute;
      border-radius: 50%;
      border: 2px solid rgba(241, 180, 52, 0.6);
      animation: ripple 1.4s ease-out infinite;
    }
    .ring:nth-child(1) { width: 180px; height: 180px; animation-delay: 0s; }
    .ring:nth-child(2) { width: 180px; height: 180px; animation-delay: 0.35s; }
    .ring:nth-child(3) { width: 180px; height: 180px; animation-delay: 0.7s; }

    @keyframes ripple {
      0%   { transform: scale(1);    opacity: 0.7; }
      100% { transform: scale(2.4);  opacity: 0;   }
    }

    /* Blue accent ring */
    .ring-blue {
      position: absolute;
      border-radius: 50%;
      border: 1.5px solid rgba(0, 87, 184, 0.5);
      width: 180px;
      height: 180px;
      animation: ripple 1.4s ease-out infinite 0.18s;
    }

    /* The logo itself – heartbeat pulse */
    #club-logo {
      position: relative;
      width: 140px;
      height: 140px;
      object-fit: contain;
      z-index: 2;
      filter: drop-shadow(0 0 24px rgba(241, 180, 52, 0.55))
              drop-shadow(0 0 8px rgba(0, 87, 184, 0.4));
      animation: heartbeat 1.4s ease-in-out infinite;
      transform-origin: center;
    }

    @keyframes heartbeat {
      0%   { transform: scale(1);    }
      14%  { transform: scale(1.10); }
      28%  { transform: scale(1);    }
      42%  { transform: scale(1.07); }
      70%  { transform: scale(1);    }
      100% { transform: scale(1);    }
    }

    /* ── Club name ── */
    .club-name {
      text-align: center;
      animation: fadeUp 0.8s ease forwards 0.5s;
      opacity: 0;
    }

    .club-name h1 {
      font-size: clamp(1.4rem, 5vw, 2rem);
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #F1B434 0%, #fff 50%, #F1B434 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: fadeUp 0.8s ease forwards 0.5s,
                 shimmer 2.5s linear infinite 1.2s;
      opacity: 0;
    }

    .club-name p {
      font-size: 0.78rem;
      font-weight: 400;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(241, 180, 52, 0.7);
      margin-top: 0.35rem;
      animation: fadeUp 0.8s ease forwards 0.75s;
      opacity: 0;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0);    }
    }

    @keyframes shimmer {
      0%   { background-position: 200% center; }
      100% { background-position: -200% center; }
    }

    /* ── Loading bar ── */
    .loading-bar-track {
      width: 160px;
      height: 3px;
      background: rgba(255,255,255,0.08);
      border-radius: 99px;
      overflow: hidden;
      animation: fadeUp 0.8s ease forwards 1s;
      opacity: 0;
    }

    .loading-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #0057B8, #F1B434);
      border-radius: 99px;
      animation: barGrow 2.2s cubic-bezier(0.4, 0, 0.2, 1) forwards 1.1s;
    }

    @keyframes barGrow {
      0%   { width: 0%;   }
      60%  { width: 75%;  }
      100% { width: 100%; }
    }

    /* ── Tagline ── */
    .tagline {
      font-size: 0.68rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.25);
      animation: fadeUp 0.8s ease forwards 1.3s;
      opacity: 0;
    }

    /* ── Exit animation ── */
    #splash.exit {
      animation: splashExit 0.55s ease forwards;
    }

    @keyframes splashExit {
      0%   { opacity: 1; transform: scale(1);    }
      100% { opacity: 0; transform: scale(1.06); }
    }
  </style>
</head>
<body>

  <canvas id="splash-canvas"></canvas>

  <div id="splash">
    <div class="logo-wrap">
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="ring-blue"></div>
      <img id="club-logo" src="assets/official-crest-transparent.png"
           onerror="this.src='assets/official-logo.png'"
           alt="Young Apostles FC Crest" draggable="false">
    </div>

    <div class="club-name">
      <h1>Young Apostles FC</h1>
      <p>Agya Na Ɔwɔ Tumi</p>
    </div>

    <div class="loading-bar-track">
      <div class="loading-bar-fill"></div>
    </div>

    <span class="tagline">Official Club Website</span>
  </div>

  <script>
    /* ── Floating particle field ── */
    (function () {
      const canvas = document.getElementById('splash-canvas');
      const ctx = canvas.getContext('2d');
      let W, H, particles = [];

      function resize() {
        W = canvas.width  = window.innerWidth;
        H = canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      function rand(min, max) { return Math.random() * (max - min) + min; }

      for (let i = 0; i < 55; i++) {
        particles.push({
          x: rand(0, 1), y: rand(0, 1),
          r: rand(0.5, 2.2),
          speed: rand(0.00008, 0.00022),
          alpha: rand(0.08, 0.45),
          color: Math.random() > 0.5 ? '241,180,52' : '0,87,184'
        });
      }

      function draw() {
        ctx.clearRect(0, 0, W, H);
        particles.forEach(p => {
          p.y -= p.speed;
          if (p.y < -0.02) { p.y = 1.02; p.x = rand(0, 1); }
          ctx.beginPath();
          ctx.arc(p.x * W, p.y * H, p.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${p.color},${p.alpha})`;
          ctx.fill();
        });
        requestAnimationFrame(draw);
      }
      draw();
    })();

    /* ── Redirect logic ── */
    const dest = window.location.hostname === 'admin.youngapostlesfcgh.com'
      ? 'admin.html'
      : 'main.html';

    // Redirect after animation completes (~2.8 s)
    setTimeout(function () {
      const splash = document.getElementById('splash');
      splash.classList.add('exit');
      setTimeout(function () {
        window.location.replace(dest);
      }, 500);
    }, 2800);
  </script>
</body>
</html>
