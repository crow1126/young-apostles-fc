<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Young Apostles FC | Official Website</title>

  <!-- Security Meta Headers -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()">
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline';
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com;
    img-src 'self' data: blob:;
    connect-src 'self';
    frame-ancestors 'none';
    base-uri 'self';
    form-action 'self'
  ">

  <link rel="icon" type="image/png" href="assets/official-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      /* Warm off-white — light enough for the logo to be clearly seen */
      background: #F4F1EC;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Outfit', sans-serif;
    }

    /* Subtle linen texture overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(43,74,122,0.07) 0%, transparent 70%),
        radial-gradient(ellipse 60% 40% at 50% 100%, rgba(201,148,58,0.06) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Particle canvas ── */
    #splash-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* ── Main splash wrapper ── */
    #splash {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.75rem;
      z-index: 10;
      opacity: 0;
      animation: splashEnter 0.7s ease forwards 0.1s;
    }

    @keyframes splashEnter {
      to { opacity: 1; }
    }

    /* ── Logo container ── */
    .logo-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 180px;
      height: 180px;
    }

    /* Muted gold ripple rings */
    .ring {
      position: absolute;
      border-radius: 50%;
      border: 1.5px solid rgba(201, 148, 58, 0.45);
      animation: ripple 1.6s ease-out infinite;
    }
    .ring:nth-child(1) { width: 180px; height: 180px; animation-delay: 0s; }
    .ring:nth-child(2) { width: 180px; height: 180px; animation-delay: 0.4s; }
    .ring:nth-child(3) { width: 180px; height: 180px; animation-delay: 0.8s; }

    @keyframes ripple {
      0%   { transform: scale(1);    opacity: 0.55; }
      100% { transform: scale(2.5);  opacity: 0;    }
    }

    /* Muted navy accent ring */
    .ring-blue {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(43, 74, 122, 0.3);
      width: 180px;
      height: 180px;
      animation: ripple 1.6s ease-out infinite 0.2s;
    }

    /* Logo – heartbeat pulse, clean drop-shadow against light bg */
    #club-logo {
      position: relative;
      width: 148px;
      height: 148px;
      object-fit: contain;
      z-index: 2;
      filter: drop-shadow(0 4px 18px rgba(43,74,122,0.18))
              drop-shadow(0 1px 4px rgba(0,0,0,0.10));
      animation: heartbeat 1.5s ease-in-out infinite;
      transform-origin: center;
    }

    @keyframes heartbeat {
      0%   { transform: scale(1);    }
      14%  { transform: scale(1.09); }
      28%  { transform: scale(1);    }
      42%  { transform: scale(1.055);}
      70%  { transform: scale(1);    }
      100% { transform: scale(1);    }
    }

    /* ── Club name ── */
    .club-name {
      text-align: center;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 0.5s;
    }

    .club-name h1 {
      font-size: clamp(1.3rem, 4.5vw, 1.85rem);
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #2B3E6B;           /* muted navy — legible on light bg */
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 0.5s;
    }

    .club-name p {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: #9B7C42;           /* warm dusty gold */
      margin-top: 0.35rem;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 0.75s;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0);    }
    }

    /* ── Loading bar ── */
    .loading-bar-track {
      width: 140px;
      height: 2px;
      background: rgba(43,74,122,0.10);
      border-radius: 99px;
      overflow: hidden;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 1s;
    }

    .loading-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #2B4A7A, #C9943A);
      border-radius: 99px;
      animation: barGrow 2.2s cubic-bezier(0.4, 0, 0.2, 1) forwards 1.1s;
    }

    @keyframes barGrow {
      0%   { width: 0%;   }
      60%  { width: 72%;  }
      100% { width: 100%; }
    }

    /* ── Tagline ── */
    .tagline {
      font-size: 0.65rem;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: rgba(43,62,107,0.38);
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 1.3s;
    }

    /* ── Exit animation ── */
    #splash.exit {
      animation: splashExit 0.5s ease forwards;
    }

    @keyframes splashExit {
      0%   { opacity: 1; transform: scale(1);    }
      100% { opacity: 0; transform: scale(1.05); }
    }
  </style>
</head>
<body>

  <canvas id="splash-canvas"></canvas>

  <div id="splash">
    <div class="logo-wrap">
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="ring-blue"></div>
      <img id="club-logo" src="assets/official-crest-transparent.png"
           onerror="this.src='assets/official-logo.png'"
           alt="Young Apostles FC Crest" draggable="false">
    </div>

    <div class="club-name">
      <h1>Young Apostles FC</h1>
      <p>Agya Na Ɔwɔ Tumi</p>
    </div>

    <div class="loading-bar-track">
      <div class="loading-bar-fill"></div>
    </div>

    <span class="tagline">Official Club Website</span>
  </div>

  <script>
    /* ── Floating particle field ── */
    (function () {
      const canvas = document.getElementById('splash-canvas');
      const ctx = canvas.getContext('2d');
      let W, H, particles = [];

      function resize() {
        W = canvas.width  = window.innerWidth;
        H = canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      function rand(min, max) { return Math.random() * (max - min) + min; }

      for (let i = 0; i < 40; i++) {
        particles.push({
          x: rand(0, 1), y: rand(0, 1),
          r: rand(0.5, 1.8),
          speed: rand(0.00006, 0.00018),
          alpha: rand(0.04, 0.18),
          color: Math.random() > 0.5 ? '43,74,122' : '201,148,58'
        });
      }

      function draw() {
        ctx.clearRect(0, 0, W, H);
        particles.forEach(p => {
          p.y -= p.speed;
          if (p.y < -0.02) { p.y = 1.02; p.x = rand(0, 1); }
          ctx.beginPath();
          ctx.arc(p.x * W, p.y * H, p.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${p.color},${p.alpha})`;
          ctx.fill();
        });
        requestAnimationFrame(draw);
      }
      draw();
    })();

    /* ── Redirect logic ── */
    const dest = window.location.hostname === 'admin.youngapostlesfcgh.com'
      ? 'admin.html'
      : 'main.html';

    // Redirect after animation completes (~2.8 s)
    setTimeout(function () {
      const splash = document.getElementById('splash');
      splash.classList.add('exit');
      setTimeout(function () {
        window.location.replace(dest);
      }, 500);
    }, 2800);
  </script>
</body>
</html>
